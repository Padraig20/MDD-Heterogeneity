# sweep.yaml
program: src.training.train
method: bayes
metric:
  name: eval/pearson_cells
  goal: maximize

parameters:
  learning-rate:
    values: [5e-3, 5e-4, 5e-5, 5e-6]
  batch-size:
    values: [2048]
  n-layers:
    values: [1, 2, 3]
  dropout:
    values: [0.0, 0.05, 0.1]
  weight-decay:
    values: [0.0005, 0.01, 0.1]


  cossim-lambda:
    values: [0]
  mpc-lambda:
    values: [0]
  mse-lambda:
    values: [1.0]
  pnll-lambda:
    values: [0]

  # booleans: sweep both; wandb will emit flags only when true
  norm-inputs:
    values: [true, false]
  norm-targets:
    values: ["none"]
  norm-layer:
    values: [true, false]

  epochs:
    value: 100

  model-name: 
    values: ["mlp", "mlp-sep"]

command:
  - ${env}
  - uv
  - run
  - python
  - -m
  - ${program}
  - -X
  - ./data/onek1k/enformer/X
  - -y
  - ./data/onek1k/y-perc-all.csv
  - --seed
  - "0"
  - -es
  - --run-name
  - "ablation-architecture-perc-mse"
  - ${args_no_boolean_flags}
